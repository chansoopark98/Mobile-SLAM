plugins { id 'com.android.application' }
def vuforiaInclude = System.getenv('VUFORIA_REFERENCE_INCLUDE')
def vuforiaLibrary = System.getenv('VUFORIA_REFERENCE_LIBRARY')
if (!vuforiaInclude || !vuforiaLibrary) {
    throw new GradleException('Run reference.py provision and build-app with official SDK paths first')
}
android {
    namespace 'com.mobileslam.vuforiareference'
    compileSdk 35
    ndkVersion '26.1.10909125'
    defaultConfig {
        applicationId 'com.mobileslam.vuforiareference'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DVUFORIA_REFERENCE_WITH_SDK=ON', "-DVUFORIA_SDK_INCLUDE=${vuforiaInclude}", "-DVUFORIA_SDK_LIBRARY=${vuforiaLibrary}"
            }
        }
    }
    externalNativeBuild { cmake { path file('../../CMakeLists.txt'); version '3.22.1' } }
}
